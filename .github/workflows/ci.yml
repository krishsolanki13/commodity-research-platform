# .github/workflows/ci.yml
# Commodity Systematic Research Platform — Continuous Integration
#
# Runs on every push and pull request to main.
# Two jobs: backend (Python) and frontend (Node).
# Both must pass for the workflow to be green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest / mypy / ruff / coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff lint
        run: python -m ruff check src/ api/ tests/ --output-format=github

      - name: ruff format check
        run: python -m ruff format src/ api/ tests/ --check

      - name: mypy
        run: python -m mypy src/ --ignore-missing-imports --no-error-summary

      - name: pytest
        run: |
          pytest tests/ api/tests/ \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend — TypeScript / ESLint / vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: ESLint
        run: cd frontend && npx eslint src --max-warnings 0

      - name: vitest
        run: cd frontend && npm test -- --run
