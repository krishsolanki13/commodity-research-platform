[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity Systematic Research Platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "yfinance>=0.2",
    "streamlit>=1.28",
    "plotly>=5.17",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "mlflow>=2.0",
    "clickhouse-connect>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff==0.4.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx2>=0.28",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "pytest-timeout",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
timeout = 300
markers = ["slow: marks tests as slow (deselect with -m 'not slow')"]
filterwarnings = [
    "ignore::ResourceWarning:pyarrow",
    "ignore::ResourceWarning:.*parquet.*",
    "ignore::UserWarning:starlette",
    "ignore::DeprecationWarning:httpx",
]

[tool.ruff]
line-length = 88
target-version = "py311"
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"dashboard/pages/*.py" = ["N999"]
