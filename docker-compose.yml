# docker-compose.yml
# Commodity Systematic Research Platform — ClickHouse local development container.
#
# Usage:
#   docker compose up -d        # start in background
#   docker compose down         # stop (data persists in volume)
#   docker compose down -v      # stop AND delete all data (destructive)
#   docker compose logs -f      # follow logs
#
# ClickHouse HTTP interface: http://localhost:8123
# ClickHouse native interface (for clickhouse-client): localhost:9000
#
# Health check: curl http://localhost:8123/ping → "Ok."

version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: commodity_research_clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect uses this)
      - "9000:9000"   # Native TCP protocol (clickhouse-client uses this)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    environment:
      CLICKHOUSE_DB: commodity_research
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--no-verbose"
        - "--tries=1"
        - "--spider"
        - "http://localhost:8123/ping"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  clickhouse_data:
    name: commodity_research_clickhouse_data
